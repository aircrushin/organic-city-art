<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Organic City</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23000'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23fff' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='3.5' fill='none' stroke='%23fff' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body class="loading" data-site="organiccity" data-mode="awaken">
  <canvas id="zc" class="filtered"></canvas>
  <canvas id="fx-overlay" aria-hidden="true"></canvas>

  <div id="art-hint" class="art-hint" aria-live="polite">
    移动唤醒画境 · 点击触发色声共鸣 · 按住拖拽扭曲时空 · 滚轮控制缩放
  </div>

  <div id="art-hud" class="art-hud" role="toolbar" aria-label="Interactive artwork controls">
    <div class="hud-group hud-modes" role="radiogroup" aria-label="Interaction mode">
      <button type="button" class="hud-btn mode-btn is-active" data-mode="awaken" aria-pressed="true" title="唤醒画境 (1)">唤醒</button>
      <button type="button" class="hud-btn mode-btn" data-mode="liquid" aria-pressed="false" title="液态流变 (2)">液态</button>
      <button type="button" class="hud-btn mode-btn" data-mode="portal" aria-pressed="false" title="时空引力 (3)">引力</button>
      <button type="button" class="hud-btn mode-btn" data-mode="bloom" aria-pressed="false" title="繁花共鸣 (4)">繁花</button>
    </div>

    <div class="hud-divider" aria-hidden="true"></div>

    <div class="hud-group hud-playback">
      <button type="button" id="btn-play" class="hud-icon-btn" aria-label="暂停或播放" title="暂停 / 播放 (Space)">
        <svg class="icon-pause" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/></svg>
        <svg class="icon-play" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M7 5.5v13l11-6.5z" fill="currentColor"/></svg>
      </button>
      <label class="speed-wrap" title="拖动调节缩放速度与方向">
        <span class="speed-tag">速度</span>
        <input id="speed-slider" type="range" min="-36" max="36" step="0.5" value="9" aria-label="缩放速度">
      </label>
    </div>

    <div class="hud-divider" aria-hidden="true"></div>

    <div class="hud-group hud-utilities">
      <button type="button" id="btn-audio" class="hud-icon-btn" aria-pressed="true" aria-label="开关色声共鸣音效" title="色声共鸣音效 (M)">
        <svg class="icon-sound-on" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M4 9.5h4.2L13.5 5v14l-5.3-4.5H4z" fill="currentColor"/><path d="M16.8 8.7a5 5 0 0 1 0 6.6M19.3 6.2a8.5 8.5 0 0 1 0 11.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <svg class="icon-sound-off" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M4 9.5h4.2L13.5 5v14l-5.3-4.5H4z" fill="currentColor"/><path d="M16.5 9.5l5 5m0-5l-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <button type="button" id="btn-fullscreen" class="hud-icon-btn" aria-pressed="false" aria-label="切换全屏" title="全屏 (F / 双击画布)">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>
